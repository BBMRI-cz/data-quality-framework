spring.application.name=Data Quality Server
server.port=8082
spring.data.rest.basePath=/api
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.info.git.mode=full
management.info.git.enabled=true
management.info.build.enabled=true
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/api-docs
springdoc.show-actuator=true
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
spring.datasource.url=jdbc:postgresql://localhost:5432/quality_server
spring.datasource.username=quality
spring.datasource.password=quality
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.jwt.expiration=3600000

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=INFO
logging.level.eu.bbmri_eric.quality.server.auth=INFO
server.error.include-stacktrace=never
server.error.include-message=never
