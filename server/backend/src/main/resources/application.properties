spring.application.name=Data Quality Server
server.port=8082
spring.data.rest.basePath=/api
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.info.git.mode=full
management.info.git.enabled=true
management.info.build.enabled=true
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/api-docs
springdoc.show-actuator=true
springdoc.swagger-ui.oauth.client-id=auth-code-client
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:5173/api/swagger-ui/oauth2-redirect.html
spring.datasource.url=jdbc:sqlite:dev_server.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.jwt.expiration=3600000
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:4011

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=INFO
logging.level.eu.bbmri_eric.quality.server.auth=INFO
server.error.include-stacktrace=never
server.error.include-message=never
