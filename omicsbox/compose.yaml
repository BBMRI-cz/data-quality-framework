services:
  omicsbox:
    build: .
    image: omicsbox:latest
    container_name: omicsbox-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated
    volumes:
      - ${OMICSBOX_DATA_PATH:-./data/wsi}:/sandbox/data/wsi:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    restart: "no"
    cpus: '2'
    mem_limit: 2G
networks:
  isolated:
    internal: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.42.0/24
