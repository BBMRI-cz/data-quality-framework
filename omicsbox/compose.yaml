# WARNING: The OmicsBox sandbox is in EARLY DEVELOPMENT and is NOT READY FOR
# PRODUCTION USE. Its APIs, check script result contract and security model
# may change without notice. Use it for evaluation/development purposes only.
services:
  omicsbox:
    build: .
    image: omicsbox:latest
    container_name: omicsbox-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated
    volumes:
      - ${OMICSBOX_DATA_PATH:-./data}:/sandbox/data:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    pids_limit: 256
    cpus: '2'
    mem_limit: 2G
networks:
  isolated:
    internal: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.42.0/24
