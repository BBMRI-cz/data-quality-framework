services:
  omicsbox:
    build: .
    image: omicsbox:latest
    container_name: omicsbox-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated
    volumes:
      - ${OMICSBOX_DATA_PATH:-./data}:/sandbox/data:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # Entity counts returned by GET /counts; leave unset for "unconfigured".
      # - OMICSBOX_PATIENT_COUNT=100
      # - OMICSBOX_IMAGES_PER_PATIENT=3
      # - OMICSBOX_SECONDARY_ENTITY_COUNT=300  # optional explicit override
      # - TIMEOUT=60
      # - MAX_REQUEST_BYTES=5242880
      # - MAX_OUTPUT_BYTES=1048576
    restart: unless-stopped
    cpus: '2'
    mem_limit: 2G
networks:
  isolated:
    internal: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.42.0/24
