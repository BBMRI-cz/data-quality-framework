services:
  omicsbox:
    build: .
    image: omicsbox:latest
    container_name: omicsbox-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated
    volumes:
      - ${OMICSBOX_DATA_PATH:-./data}:/sandbox/data:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # Waitress + app settings are forwarded from the shell or a .env file
    # (each is only set in the container when set on the host). The data
    # path is owned by the volume mount above, hence no OMICSBOX_DATA_DIR.
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    pids_limit: 256
    cpus: '2'
    mem_limit: 2G
networks:
  isolated:
    internal: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.42.0/24
