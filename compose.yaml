name: Data Quality Framework
services:
  quality-agent:
    image: ghcr.io/bbmri-cz/data-quality-agent:latest
    container_name: quality-agent
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - agent-data:/app/data
    networks:
      - default
      - isolated
    extra_hosts:
      - "host.docker.internal:host-gateway"
  quality-server:
    image: ghcr.io/bbmri-cz/data-quality-server:latest
    container_name: quality-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://server-db:5432/quality_server
    ports:
      - "8082:8082"
    depends_on:
      server-db:
        condition: service_healthy
  server-db:
    image: postgres:17
    container_name: server-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: quality_server
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: quality
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - server-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality -d quality_server"]
      interval: 5s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------------------------
  # WARNING: The OmicsBox sandbox is in EARLY DEVELOPMENT and is NOT READY FOR
  # PRODUCTION USE. Its APIs, check script result contract and security model
  # may change without notice. Enable it (via the `omicsbox` profile) for
  # evaluation/development purposes only.
  # ---------------------------------------------------------------------------
  omicsbox:
    profiles:
      - omicsbox
    build: ./omicsbox
    image: omicsbox:latest
    container_name: omicsbox-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated
    volumes:
      - ${OMICSBOX_DATA_PATH:-./omicsbox/data/mican}:/sandbox/data:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - OMICSBOX_API_TOKEN=${OMICSBOX_API_TOKEN:-}
      # Entity totals are recorded only when the operator provides them; unset means unknown.
      - OMICSBOX_PATIENT_COUNT=${OMICSBOX_PATIENT_COUNT:-}
      - OMICSBOX_SECONDARY_ENTITY_COUNT=${OMICSBOX_SECONDARY_ENTITY_COUNT:-}
    restart: unless-stopped
    pids_limit: 256
    cpus: '2'
    mem_limit: 2G
volumes:
  agent-data:
    driver: local
  server-db-data:
    driver: local
networks:
  isolated:
    internal: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.42.0/24